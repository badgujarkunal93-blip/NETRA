services:
  - type: web
    name: netra-suspect-priority-service
    env: python
    rootDir: priority-model-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_REASONING_MODEL
        value: "llama-3.1-8b-instant"
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOW_HEURISTIC_FALLBACK
        value: "false"
