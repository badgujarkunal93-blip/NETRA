services:
  - type: web
    name: netra-suspect-priority-service
    env: python
    rootDir: priority-model-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_REASONING_MODEL
        value: "openai/gpt-oss-120b"
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOW_HEURISTIC_FALLBACK
        value: "false"
